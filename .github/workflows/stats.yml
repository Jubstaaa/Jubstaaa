name: stats

on:
    schedule:
        - cron: '0 5 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: stats
                  options: username=Jubstaaa&show_icons=true&theme=tokyonight&hide_border=true&bg_color=1a1b26&title_color=7aa2f7&icon_color=bb9af7&text_color=c0caf5&include_all_commits=true&count_private=true&rank_icon=github
                  path: profile/stats.svg
                  token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

            - uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: top-langs
                  options: username=Jubstaaa&layout=compact&theme=tokyonight&hide_border=true&bg_color=1a1b26&title_color=7aa2f7&text_color=c0caf5&langs_count=8&hide=html,css,scss
                  path: profile/top-langs.svg
                  token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

            - uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Jubstaaa&repo=hono-telescope&theme=tokyonight&hide_border=true&bg_color=1a1b26&title_color=7aa2f7&icon_color=bb9af7&text_color=c0caf5&description_lines_count=3
                  path: profile/pin-hono-telescope.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Jubstaaa&repo=tailwind-hitslop&theme=tokyonight&hide_border=true&bg_color=1a1b26&title_color=7aa2f7&icon_color=bb9af7&text_color=c0caf5&description_lines_count=3
                  path: profile/pin-tailwind-hitslop.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Jubstaaa&repo=iconstate&theme=tokyonight&hide_border=true&bg_color=1a1b26&title_color=7aa2f7&icon_color=bb9af7&text_color=c0caf5&description_lines_count=3
                  path: profile/pin-iconstate.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Jubstaaa&repo=lol-config-editor&theme=tokyonight&hide_border=true&bg_color=1a1b26&title_color=7aa2f7&icon_color=bb9af7&text_color=c0caf5&description_lines_count=3
                  path: profile/pin-lol-config-editor.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Jubstaaa&repo=standup-mr&theme=tokyonight&hide_border=true&bg_color=1a1b26&title_color=7aa2f7&icon_color=bb9af7&text_color=c0caf5&description_lines_count=3
                  path: profile/pin-standup-mr.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - uses: stats-organization/github-readme-stats-action@v2
              with:
                  card: pin
                  options: username=Jubstaaa&repo=auto-watch&theme=tokyonight&hide_border=true&bg_color=1a1b26&title_color=7aa2f7&icon_color=bb9af7&text_color=c0caf5&description_lines_count=3
                  path: profile/pin-auto-watch.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add profile
                  git commit -m "chore: update stats cards" || exit 0
                  git pull --rebase
                  git push
