name: blog

on:
    schedule:
        - cron: '0 4 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: gautamkrishnar/blog-post-workflow@v1
              with:
                  feed_list: 'https://ilkerbalcilar.com/feed.xml'
                  max_post_count: 5
                  template: '- [$title]($url) <sub>$date</sub>$newline'
                  date_format: 'mmm d, yyyy'
                  commit_message: 'chore: update blog posts'
