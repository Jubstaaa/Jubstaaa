name: snake

on:
    schedule:
        - cron: '0 3 * * *'
    workflow_dispatch:
    push:
        branches: [main]

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - uses: Platane/snk@v3
              with:
                  github_user_name: Jubstaaa
                  outputs: |
                      dist/github-snake.svg?palette=github-light
                      dist/github-snake-dark.svg?palette=github-dark&color_dots=#1a1b26,#3d59a1,#5a7cc9,#7aa2f7,#bb9af7

            - uses: crazy-max/ghaction-github-pages@v4
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
