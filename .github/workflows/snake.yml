name: snake

on:
    schedule:
        - cron: '0 3 * * *'
    workflow_dispatch:
    push:
        branches: [main]

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - uses: Platane/snk@v3
              with:
                  github_user_name: Jubstaaa
                  outputs: |
                      dist/github-snake.svg?palette=github-light&color_snake=#0070bf&color_dots=#ebedf0,#b8dcf5,#6fb6e8,#2b8fd6,#0070bf
                      dist/github-snake-dark.svg?palette=github-dark&color_snake=#4ebcff&color_dots=#161b22,#123247,#1d5a80,#2f8bc4,#4ebcff

            - uses: crazy-max/ghaction-github-pages@v4
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
